<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Make_Clean_PPTX</title>
  <desc id="d">Agent skill that turns notes into PowerPoint decks from 54 slide layouts and 68 charts and diagrams.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2333"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="48" y="48" width="6" height="64" rx="3" fill="url(#acc)"/>

  <text x="72" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Make_Clean_PPTX</text>
  <text x="72" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9AA5B8">Notes in, PowerPoint out. Checked before delivery.</text>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="176" width="150" height="34" rx="17" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <text x="147" y="198" text-anchor="middle" fill="#34D399">AGENT SKILL</text>
    <rect x="236" y="176" width="190" height="34" rx="17" fill="none" stroke="#3B4660" stroke-width="1.5"/>
    <text x="331" y="198" text-anchor="middle" fill="#9AA5B8">54 LAYOUTS</text>
    <rect x="440" y="176" width="190" height="34" rx="17" fill="none" stroke="#3B4660" stroke-width="1.5"/>
    <text x="535" y="198" text-anchor="middle" fill="#9AA5B8">68 VISUALS</text>
  </g>

  <!-- stack of slides -->
  <g transform="translate(790 46)">
    <rect x="70" y="0" width="300" height="170" rx="10" fill="#243049" stroke="#3B4660"/>
    <rect x="35" y="36" width="300" height="170" rx="10" fill="#2A3753" stroke="#3B4660"/>
    <rect x="0" y="72" width="300" height="170" rx="10" fill="#FFFFFF"/>
    <rect x="24" y="96" width="140" height="14" rx="4" fill="#111111"/>
    <rect x="24" y="122" width="96" height="8" rx="4" fill="#D0D0D0"/>
    <rect x="24" y="138" width="116" height="8" rx="4" fill="#D0D0D0"/>
    <rect x="24" y="154" width="84" height="8" rx="4" fill="#D0D0D0"/>
    <rect x="184" y="150" width="18" height="52" fill="#1F1F1F"/>
    <rect x="208" y="128" width="18" height="74" fill="#8C8C8C"/>
    <rect x="232" y="108" width="18" height="94" fill="#1F1F1F"/>
    <rect x="256" y="138" width="18" height="64" fill="#B3B3B3"/>
    <rect x="180" y="204" width="98" height="1.5" fill="#D9D9D9"/>
    <rect x="24" y="190" width="60" height="6" rx="3" fill="#10B981"/>
  </g>

</svg>
