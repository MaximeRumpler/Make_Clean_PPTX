<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 85 920 120" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- GitHub Dark Theme Card Gradient -->
    <linearGradient id="ghCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- GitHub Green Accent Gradient for the final deck -->
    <linearGradient id="ghGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="ghShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#238636" flood-opacity="0.4" />
    </filter>

    <!-- Arrow head -->
    <marker id="ghArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#30363d" />
    </marker>
  </defs>

  <!-- Connecting Line / Timeline track -->
  <path d="M 160 145 H 840" fill="none" stroke="#30363d" stroke-width="2" />

  <!-- STEP 1: your notes -->
  <g transform="translate(60, 100)" filter="url(#ghShadow)">
    <rect width="130" height="90" rx="6" fill="url(#ghCard)" stroke="#30363d" stroke-width="1.5" />
    <text x="65" y="42" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="middle">your notes</text>
    <text x="65" y="65" fill="#8b949e" font-size="12" font-weight="400" text-anchor="middle">form</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 200 145 L 235 145" fill="none" stroke="#30363d" stroke-width="2" marker-end="url(#ghArrow)" />

  <!-- STEP 2: Make_Clean -->
  <g transform="translate(245, 100)" filter="url(#ghShadow)">
    <rect width="130" height="90" rx="6" fill="url(#ghCard)" stroke="#30363d" stroke-width="1.5" />
    <text x="65" y="42" fill="#58a6ff" font-size="14" font-weight="600" text-anchor="middle">Make_Clean</text>
    <text x="65" y="65" fill="#8b949e" font-size="12" font-weight="400" text-anchor="middle">form</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 385 145 L 420 145" fill="none" stroke="#30363d" stroke-width="2" marker-end="url(#ghArrow)" />

  <!-- STEP 3: Make_Style -->
  <g transform="translate(430, 100)" filter="url(#ghShadow)">
    <rect width="130" height="90" rx="6" fill="url(#ghCard)" stroke="#30363d" stroke-width="1.5" />
    <text x="65" y="42" fill="#58a6ff" font-size="14" font-weight="600" text-anchor="middle">Make_Style</text>
    <text x="65" y="65" fill="#8b949e" font-size="12" font-weight="400" text-anchor="middle">look</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 570 145 L 605 145" fill="none" stroke="#30363d" stroke-width="2" marker-end="url(#ghArrow)" />

  <!-- STEP 4: Make_Colors -->
  <g transform="translate(615, 100)" filter="url(#ghShadow)">
    <rect width="130" height="90" rx="6" fill="url(#ghCard)" stroke="#30363d" stroke-width="1.5" />
    <text x="65" y="42" fill="#58a6ff" font-size="14" font-weight="600" text-anchor="middle">Make_Colors</text>
    <text x="65" y="65" fill="#8b949e" font-size="12" font-weight="400" text-anchor="middle">brand</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 755 145 L 790 145" fill="none" stroke="#30363d" stroke-width="2" marker-end="url(#ghArrow)" />

  <!-- STEP 5: your deck (GitHub Green Highlight Theme) -->
  <g transform="translate(800, 95)" filter="url(#greenGlow)">
    <rect width="140" height="100" rx="6" fill="url(#ghGreenGrad)" stroke="#3fb950" stroke-width="1.5" />
    <text x="70" y="47" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">your deck</text>
    <text x="70" y="70" fill="#f0f6fc" font-size="12" font-weight="500" text-anchor="middle">ready to present</text>
  </g>

</svg>